<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stemik · облік моделей</title>
<style>

  html,body{ margin:0; padding:0; background:#F8F6F2; }
  #root{ min-height:100vh; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes softPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,142,69,0.32); } 50%{ box-shadow:0 0 0 5px rgba(224,142,69,0); } }
  @keyframes dotPulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.45; transform:scale(0.8); } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); } 20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); } 40%,60%{ transform:translateX(4px); }
  }
  .studio-app{
    --ink:#05263F; --ink-soft:#5C7386; --paper:#F8F6F2; --card:#FFFFFF;
    --line:#EBE6DC; --line-strong:#DAD2C2;
    --brand:#5CA7C9; --brand-dark:#3D84A6; --brand-soft:#E9F3F7; --brand-text:#2E6E8E;
    --sand:#E3DFD6; --sand-text:#8A7F6C;
    --alert:#E08E45; --alert-soft:#FBEADA; --alert-text:#A15D1D;
    --font-display:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-body:'Segoe UI',Arial,sans-serif;
    --font-mono:'Consolas','Courier New',monospace;
    font-family:var(--font-body); color:var(--ink); background:var(--paper);
    min-height:100vh; width:100%; box-sizing:border-box; position:relative;
  }
  .studio-app *{ box-sizing:border-box; }
  .studio-app .bg-grid{
    position:absolute; inset:0; pointer-events:none; opacity:0.6;
    background-image:radial-gradient(circle, var(--line-strong) 1px, transparent 1px);
    background-size:26px 26px; mask-image:linear-gradient(to bottom, black, transparent 380px);
  }
  .studio-shell{ position:relative; display:flex; min-height:100vh; max-width:1120px; margin:0 auto; }
  .studio-sidebar{
    width:206px; flex-shrink:0; padding:22px 14px; display:flex; flex-direction:column; gap:4px;
    border-right:1px solid var(--line);
  }
  .studio-brand{ padding:2px 6px 18px; display:flex; align-items:center; gap:10px; }
  .studio-brand-title{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-0.01em; line-height:1.15; color:var(--ink); }
  .studio-brand-sub{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); margin-top:3px; letter-spacing:0.02em; text-transform:uppercase; }
  .section-switch{ display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:14px; background:var(--card); }
  .section-switch button{
    font-family:var(--font-body); font-size:12.5px; font-weight:500; border:none; background:transparent; color:var(--ink-soft);
    padding:7px 10px; border-radius:7px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:6px; transition:background .15s ease, color .15s ease;
  }
  .section-switch button.active{ background:var(--ink); color:#fff; }
  .nav-group{ display:flex; flex-direction:column; gap:4px; }
  .studio-nav-btn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none; background:transparent;
    font-family:var(--font-body); font-size:13.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; text-align:left;
    width:100%; transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .studio-nav-btn:hover{ background:var(--brand-soft); color:var(--brand-text); }
  .studio-nav-btn.active{ background:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(92,167,201,0.35); }
  .studio-nav-badge{
    margin-left:auto; font-family:var(--font-mono); font-size:10.5px; background:var(--alert); color:#fff;
    border-radius:20px; padding:1px 6px; min-width:18px; text-align:center; line-height:1.4;
  }
  .studio-nav-btn.active .studio-nav-badge{ background:rgba(255,255,255,0.3); }
  .studio-sync{ margin-top:auto; padding:10px 8px 2px; font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .studio-sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--brand); flex-shrink:0; transition:background .2s ease; }
  .studio-sync-dot.error{ background:var(--alert); }
  .studio-sync-dot.pulsing{ animation:dotPulse 1s ease-in-out infinite; }
  .logout-btn{ margin:2px 8px 0; justify-content:flex-start; color:var(--ink-soft); }
  .logout-btn:hover{ color:var(--alert-text); background:var(--alert-soft); }
  .studio-main{ flex:1; min-width:0; padding:26px 30px 60px; overflow:hidden; }
  .tab-fade{ animation:fadeInUp .28s cubic-bezier(.22,.8,.32,1) both; }
  .studio-page-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  .studio-page-title{ font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .studio-btn{
    font-family:var(--font-body); font-size:13px; font-weight:500; border-radius:8px; padding:8px 14px;
    border:1px solid var(--line-strong); background:var(--card); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .studio-btn:hover{ border-color:var(--brand); transform:translateY(-1px); }
  .studio-btn:active{ transform:translateY(0); }
  .studio-btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .studio-btn.primary:hover{ background:var(--brand-dark); border-color:var(--brand-dark); box-shadow:0 4px 12px rgba(92,167,201,0.38); }
  .studio-btn.danger{ color:var(--alert-text); border-color:var(--alert-soft); background:var(--alert-soft); }
  .studio-btn.danger:hover{ border-color:var(--alert); }
  .studio-btn.ghost{ border-color:transparent; background:transparent; padding:6px 8px; }
  .studio-btn.ghost:hover{ background:var(--brand-soft); transform:none; }
  .studio-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .studio-segmented{ display:inline-flex; border:1px solid var(--line-strong); border-radius:9px; padding:2px; background:var(--card); }
  .studio-segmented button{
    font-family:var(--font-body); font-size:12.5px; font-weight:500; border:none; background:transparent; color:var(--ink-soft);
    padding:6px 12px; border-radius:7px; cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .studio-segmented button.active{ background:var(--brand-soft); color:var(--brand-text); }
  .studio-hero{
    border:1px solid var(--line); background:linear-gradient(135deg, var(--brand-soft), var(--card) 60%); border-radius:12px;
    padding:16px 18px; margin-bottom:22px; display:flex; gap:16px; align-items:flex-start; position:relative; overflow:hidden;
  }
  .studio-hero::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg, var(--brand), var(--sand)); }
  .studio-hero-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--brand-text); letter-spacing:0.03em; margin-bottom:4px; text-transform:uppercase; }
  .studio-hero-theme{ font-family:var(--font-display); font-size:17px; font-weight:700; }
  .studio-hero-date{ font-family:var(--font-body); font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .datecard{ width:60px; flex-shrink:0; border-radius:8px; overflow:hidden; border:1px solid var(--line-strong); background:var(--card); }
  .datecard.big{ width:68px; }
  .datecard.big .datecard-day{ font-size:25px; }
  .datecard-top{ background:var(--ink); color:#fff; text-align:center; font-family:var(--font-mono); font-size:9.5px; padding:3px 0; letter-spacing:0.05em; }
  .datecard-body{ text-align:center; padding:6px 0 8px; }
  .datecard-day{ font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1; color:var(--ink); }
  .datecard-weekday{ font-family:var(--font-mono); font-size:9px; color:var(--ink-soft); margin-top:3px; letter-spacing:0.04em; }
  .lesson-card{
    border:1px solid var(--line); background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:14px;
    display:flex; gap:16px; animation:fadeInUp .3s ease both; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .lesson-card:hover{ border-color:var(--line-strong); box-shadow:0 4px 16px rgba(5,38,63,0.07); }
  .lesson-card.past{ opacity:0.6; }
  .lesson-main{ flex:1; min-width:0; }
  .lesson-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .lesson-heading{ min-width:0; }
  .lesson-theme{ font-family:var(--font-display); font-size:16.5px; font-weight:700; line-height:1.3; }
  .lesson-meta-row{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:5px; }
  .lesson-time{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }
  .lesson-progress{ font-family:var(--font-mono); font-size:10.5px; color:var(--brand-text); background:var(--brand-soft); border-radius:20px; padding:2px 8px; }
  .lesson-actions{ display:flex; gap:2px; flex-shrink:0; }
  .lesson-series-tag{ display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:10px; color:var(--brand-text); }
  .student-panel{ margin-top:14px; background:var(--paper); border-radius:10px; padding:6px 12px; }
  .student-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .student-row:first-child{ border-top:none; }
  .student-name{ font-size:13.5px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info-banner{
    display:flex; align-items:center; gap:8px; background:var(--brand-soft); color:var(--brand-text); font-size:12.5px; font-weight:500;
    border-radius:10px; padding:10px 14px; margin-bottom:18px;
  }
  .thumb-spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--brand-soft); border-top-color:var(--brand);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .thumb-slot{
    width:34px; height:34px; border-radius:8px; border:1.5px dashed var(--line-strong); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; overflow:hidden; position:relative;
    transition:border-color .15s ease, transform .15s ease;
  }
  .thumb-slot img{ width:100%; height:100%; object-fit:cover; }
  .thumb-slot:hover{ border-color:var(--brand); transform:scale(1.05); }
  .thumb-slot.readonly{ cursor:default; }
  .thumb-slot.readonly:hover{ border-color:var(--line-strong); transform:none; }
  .due-flag{
    display:inline-flex; align-items:center; gap:5px; background:var(--alert-soft); color:var(--alert-text);
    border-radius:20px; padding:4px 9px 4px 5px; font-size:11px; font-weight:600; cursor:pointer; border:none; flex-shrink:0;
    animation:softPulse 2.4s ease-in-out infinite;
  }
  .due-flag img{ width:20px; height:20px; border-radius:5px; object-fit:cover; }
  .printed-pill{ font-family:var(--font-mono); font-size:10px; color:var(--brand-text); background:var(--brand-soft); border-radius:20px; padding:3px 8px; flex-shrink:0; display:inline-flex; align-items:center; gap:4px; border:none; cursor:pointer; transition:transform .12s ease; }
  .printed-pill:active{ transform:scale(0.95); }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; border:1px solid var(--line-strong);
    background:var(--card); font-size:12.5px; cursor:pointer; user-select:none; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .chip.selected{ background:var(--brand); color:#fff; border-color:var(--brand); transform:scale(1.03); }
  .empty-state{ border:1.5px dashed var(--line-strong); border-radius:12px; padding:30px 20px 34px; text-align:center; color:var(--ink-soft); animation:fadeIn .3s ease both; }
  .empty-mascot{ display:flex; justify-content:center; margin-bottom:6px; }
  .empty-mascot img{ width:150px; height:auto; animation:floaty 3.4s ease-in-out infinite; border-radius:10px; }
  .empty-state-title{ font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .empty-state-sub{ font-size:13px; max-width:320px; margin:0 auto; }
  .students-list{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .students-row{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line); animation:fadeInUp .25s ease both; transition:background .15s ease; }
  .students-row:hover{ background:var(--paper); }
  .students-row:last-child{ border-bottom:none; }
  .admin-row{ cursor:pointer; }
  .role-badge{ font-family:var(--font-mono); font-size:9px; text-transform:uppercase; background:var(--ink); color:#fff; border-radius:20px; padding:2px 7px; letter-spacing:0.03em; }
  .role-badge.me{ background:var(--brand); }
  .avatar{
    width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg, var(--brand-soft), var(--sand)); color:var(--brand-text);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:13px; flex-shrink:0;
  }
  .students-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); }
  .print-item{ display:flex; gap:12px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:10px; animation:fadeInUp .3s ease both; transition:box-shadow .15s ease; }
  .print-item:hover{ box-shadow:0 3px 14px rgba(5,38,63,0.06); }
  .print-thumb{ width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; border:1px solid var(--line); transition:transform .15s ease; }
  .print-thumb:hover{ transform:scale(1.06); }
  .print-item-name{ font-weight:700; font-size:14px; }
  .print-item-origin{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .print-item-due{ font-family:var(--font-mono); font-size:11px; color:var(--alert-text); margin-top:3px; display:flex; align-items:center; gap:4px; }
  .overlay{ position:fixed; inset:0; background:rgba(5,38,63,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; animation:fadeIn .18s ease both; }
  .modal{ background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; animation:modalIn .22s cubic-bezier(.22,.9,.36,1) both; }
  .modal-title{ font-family:var(--font-display); font-size:17px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; }
  .field-label{ font-size:12px; font-weight:500; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .field{ margin-bottom:14px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field input[type=password], .field input[type=email]{
    width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:9px 10px; font-family:var(--font-body); font-size:13.5px; background:var(--paper); color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .preview-img{ max-width:100%; max-height:60vh; border-radius:10px; display:block; margin:0 auto; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .loading-block{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px; }

  .admin-view-bar{ display:flex; align-items:center; gap:14px; padding:18px 30px 0; flex-wrap:wrap; }
  .admin-view-title{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }

  .login-app{ display:flex; align-items:center; justify-content:center; }
  .login-wrap{ position:relative; width:100%; display:flex; justify-content:center; padding:20px; }
  .login-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 30px 28px;
    width:100%; max-width:360px; text-align:center; box-shadow:0 12px 34px rgba(5,38,63,0.09);
    animation:modalIn .32s cubic-bezier(.22,.9,.36,1) both;
  }
  .login-card.shake{ animation:shake .42s ease; }
  .login-mascot{ width:70px; height:auto; margin-bottom:4px; }
  .login-title{ font-family:var(--font-display); font-size:21px; font-weight:700; color:var(--ink); }
  .login-sub{ font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; margin-top:3px; margin-bottom:14px; }
  .login-tabs{ display:flex; border:1px solid var(--line-strong); border-radius:9px; padding:2px; background:var(--paper); }
  .login-tabs button{
    flex:1; font-family:var(--font-body); font-size:12.5px; font-weight:600; border:none; background:transparent; color:var(--ink-soft);
    padding:7px 10px; border-radius:7px; cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .login-tabs button.active{ background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(5,38,63,0.08); }
  .login-card .field{ text-align:left; }
  .login-error{
    display:flex; align-items:center; gap:6px; justify-content:center; background:var(--alert-soft); color:var(--alert-text);
    font-size:12px; font-weight:500; border-radius:8px; padding:8px 10px; margin-bottom:12px; animation:fadeIn .2s ease both;
  }
  .login-info{
    display:flex; align-items:center; gap:6px; justify-content:center; background:var(--brand-soft); color:var(--brand-text);
    font-size:12px; font-weight:500; border-radius:8px; padding:8px 10px; margin-bottom:12px; animation:fadeIn .2s ease both; text-align:left;
  }
  .login-btn{ width:100%; justify-content:center; padding:10px 14px; font-size:14px; margin-top:4px; }

  @media (max-width: 760px){
    .studio-shell{ flex-direction:column; }
    .studio-sidebar{ width:100%; padding:10px 12px; gap:4px; border-right:none; border-bottom:1px solid var(--line); }
    .studio-brand{ padding-bottom:10px; }
    .nav-group{ flex-direction:row; }
    .studio-nav-btn{ flex:1; justify-content:center; }
    .studio-sync{ display:none; }
    .section-switch{ flex-direction:row; }
    .studio-main{ padding:18px 16px 40px; }
    .admin-view-bar{ padding:14px 16px 0; }
  }

</style>
</head>
<body>
<div id="root"></div>
