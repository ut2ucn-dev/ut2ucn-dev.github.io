<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stemik · облік моделей</title>
<style>

  html,body{ margin:0; padding:0; background:var(--paper, #F8F6F2); }
  #root{ min-height:100vh; }
  :root{
    --ink:#05263F; --ink-soft:#5C7386; --paper:#F8F6F2; --card:#FFFFFF;
    --line:#EBE6DC; --line-strong:#DAD2C2;
    --brand:#5CA7C9; --brand-dark:#3D84A6; --brand-soft:#E9F3F7; --brand-text:#2E6E8E;
    --sand:#E3DFD6; --sand-text:#8A7F6C;
    --alert:#E08E45; --alert-soft:#FBEADA; --alert-text:#A15D1D;
    --success:#4FA870; --success-soft:#E4F3E8; --success-text:#2E7A4A;
    --navy:#0B2436;
    color-scheme: light;
    --font-display:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-body:'Segoe UI',Arial,sans-serif;
    --font-mono:'Consolas','Courier New',monospace;
  }
  :root.theme-dark{
    --ink:#EAF0F4; --ink-soft:#8FA2B3; --paper:#0D1620; --card:#16212C;
    --line:#233240; --line-strong:#32485C;
    --brand:#6FB8D8; --brand-dark:#8FD0EC; --brand-soft:rgba(111,184,216,0.16); --brand-text:#8FD0EC;
    --sand:#3A3226; --sand-text:#C9BFA8;
    --alert:#F0A25E; --alert-soft:rgba(240,162,94,0.16); --alert-text:#F5B879;
    --success:#5FC486; --success-soft:rgba(95,196,134,0.16); --success-text:#7FDBA0;
    --navy:#0B2436;
    color-scheme: dark;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes softPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,142,69,0.32); } 50%{ box-shadow:0 0 0 5px rgba(224,142,69,0); } }
  @keyframes dotPulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.45; transform:scale(0.8); } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); } 20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); } 40%,60%{ transform:translateX(4px); }
  }
  .studio-app{
    font-family:var(--font-body); color:var(--ink); background:var(--paper);
    min-height:100vh; width:100%; box-sizing:border-box; position:relative;
    transition:background-color .2s ease, color .2s ease;
  }
  .studio-app *{ box-sizing:border-box; }
  .studio-app .bg-grid{
    position:absolute; inset:0; pointer-events:none; opacity:0.6;
    background-image:radial-gradient(circle, var(--line-strong) 1px, transparent 1px);
    background-size:26px 26px; mask-image:linear-gradient(to bottom, black, transparent 380px);
  }
  .studio-shell{ position:relative; display:flex; min-height:100vh; max-width:1120px; margin:0 auto; }
  .studio-sidebar{
    width:224px; flex-shrink:0; padding:22px 14px; display:flex; flex-direction:column; gap:4px;
    border-right:1px solid var(--line);
  }
  .studio-brand{ padding:2px 6px 18px; display:flex; align-items:center; gap:10px; }
  .studio-brand-title{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; line-height:1.15; color:var(--ink); }
  .studio-brand-sub{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); margin-top:3px; letter-spacing:0.02em; text-transform:uppercase; }
  .section-switch{ display:flex; flex-direction:column; gap:2px; border:1.5px solid var(--line); border-radius:11px; padding:4px; margin-bottom:16px; background:var(--card); }
  .section-switch button{
    font-family:var(--font-body); font-size:13.5px; font-weight:600; border:none; background:transparent; color:var(--ink-soft);
    padding:9px 12px; border-radius:8px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:8px; transition:background .15s ease, color .15s ease;
  }
  .section-switch button.active{ background:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(92,167,201,0.32); }
  .nav-group{ display:flex; flex-direction:column; gap:5px; }
  .studio-nav-btn{
    display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:10px; border:none; background:transparent;
    font-family:var(--font-body); font-size:14.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; text-align:left;
    width:100%; transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .studio-nav-btn:hover{ background:var(--brand-soft); color:var(--brand-text); transform:translateX(1px); }
  .studio-nav-btn.active{ background:var(--brand); color:#fff; box-shadow:0 4px 12px rgba(92,167,201,0.35); }
  .studio-nav-badge{
    margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:700; background:var(--alert); color:#fff;
    border-radius:20px; padding:2px 7px; min-width:19px; text-align:center; line-height:1.4;
  }
  .studio-nav-btn.active .studio-nav-badge{ background:rgba(255,255,255,0.3); }
  .studio-sync{ margin-top:auto; padding:10px 8px 2px; font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .studio-sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--brand); flex-shrink:0; transition:background .2s ease; }
  .studio-sync-dot.error{ background:var(--alert); }
  .studio-sync-dot.pulsing{ animation:dotPulse 1s ease-in-out infinite; }
  .logout-btn{ margin:2px 8px 0; justify-content:flex-start; color:var(--ink-soft); }
  .logout-btn:hover{ color:var(--alert-text); background:var(--alert-soft); }
  .studio-main{ flex:1; min-width:0; padding:26px 30px 60px; overflow:hidden; }
  .tab-fade{ animation:fadeIn .28s ease both; }
  .studio-page-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  .studio-page-title{ font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .studio-btn{
    font-family:var(--font-body); font-size:14px; font-weight:600; border-radius:10px; padding:10px 18px;
    border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(5,38,63,0.04);
  }
  .studio-btn:hover{ border-color:var(--brand); transform:translateY(-1px); box-shadow:0 3px 10px rgba(5,38,63,0.08); }
  .studio-btn:active{ transform:translateY(0); }
  .studio-btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(92,167,201,0.3); }
  .studio-btn.primary:hover{ background:var(--brand-dark); border-color:var(--brand-dark); box-shadow:0 5px 16px rgba(92,167,201,0.42); }
  .studio-btn.danger{ color:var(--alert-text); border-color:var(--alert-soft); background:var(--alert-soft); }
  .studio-btn.danger:hover{ border-color:var(--alert); box-shadow:0 3px 10px rgba(224,142,69,0.2); }
  .studio-btn.ghost{
    border-color:var(--line); background:var(--paper); padding:9px 10px; box-shadow:none; color:var(--ink-soft);
  }
  .studio-btn.ghost:hover{ background:var(--brand-soft); border-color:var(--brand); color:var(--brand-text); transform:translateY(-1px); }
  .studio-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .theme-toggle{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex-shrink:0;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .2s ease;
  }
  .theme-toggle:hover{ border-color:var(--brand); color:var(--brand-text); transform:rotate(18deg); background:var(--brand-soft); }
  .studio-segmented{ display:inline-flex; border:1.5px solid var(--line-strong); border-radius:11px; padding:3px; background:var(--card); }
  .studio-segmented button{
    font-family:var(--font-body); font-size:12.5px; font-weight:500; border:none; background:transparent; color:var(--ink-soft);
    padding:6px 12px; border-radius:7px; cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .studio-segmented button.active{ background:var(--brand-soft); color:var(--brand-text); }
  .studio-hero{
    border:1.5px solid var(--brand); background:linear-gradient(135deg, var(--brand-soft), var(--card) 65%); border-radius:16px;
    padding:20px 22px; margin-bottom:22px; display:flex; gap:18px; align-items:flex-start; position:relative; overflow:hidden;
    box-shadow:0 4px 18px rgba(92,167,201,0.12);
  }
  .studio-hero::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg, var(--brand), var(--sand)); }
  .studio-hero-label{ font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--brand-text); letter-spacing:0.04em; margin-bottom:5px; text-transform:uppercase; }
  .studio-hero-theme{ font-family:var(--font-display); font-size:19px; font-weight:700; }
  .studio-hero-date{ font-family:var(--font-body); font-size:13.5px; color:var(--ink-soft); margin-top:3px; }

  .stats-row{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-card{
    flex:1; min-width:140px; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); background:var(--card); position:relative; overflow:hidden;
  }
  .stat-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--stat-color, var(--brand)); }
  .stat-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--stat-soft, var(--brand-soft)); color:var(--stat-color, var(--brand-text));
  }
  .stat-value{ font-family:var(--font-display); font-size:21px; font-weight:700; line-height:1.1; }
  .stat-label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .datecard{ width:64px; flex-shrink:0; border-radius:10px; overflow:hidden; border:1.5px solid var(--line-strong); background:var(--card); box-shadow:0 2px 6px rgba(5,38,63,0.05); }
  .datecard.big{ width:74px; }
  .datecard.big .datecard-day{ font-size:27px; }
  .datecard-top{ background:linear-gradient(135deg, var(--brand), var(--navy)); color:#fff; text-align:center; font-family:var(--font-mono); font-size:9.5px; font-weight:700; padding:4px 0; letter-spacing:0.05em; }
  .datecard-body{ text-align:center; padding:7px 0 9px; }
  .datecard-day{ font-family:var(--font-display); font-size:23px; font-weight:700; line-height:1; color:var(--ink); }
  .datecard-weekday{ font-family:var(--font-mono); font-size:9px; color:var(--ink-soft); margin-top:3px; letter-spacing:0.04em; }
  .datecard-time{ font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--brand-text); margin-top:4px; padding-top:4px; border-top:1px solid var(--line); }
  .lesson-card{
    border:1px solid var(--line); background:var(--card); border-radius:14px; padding:16px 18px 16px 22px; margin-bottom:14px;
    display:flex; gap:16px; animation:fadeInUp .3s ease both; transition:border-color .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden;
  }
  .lesson-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--lesson-accent, var(--line-strong));
  }
  .lesson-card:hover{ border-color:var(--line-strong); box-shadow:0 4px 16px rgba(5,38,63,0.07); }
  .lesson-card.past{ opacity:0.6; }
  .lesson-main{ flex:1; min-width:0; }
  .lesson-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .lesson-heading{ min-width:0; }
  .lesson-theme{ font-family:var(--font-display); font-size:17.5px; font-weight:700; line-height:1.3; }
  .lesson-meta-row{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .lesson-time{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }
  .lesson-progress{ font-family:var(--font-mono); font-weight:700; font-size:10.5px; color:var(--brand-text); background:var(--brand-soft); border-radius:20px; padding:3px 9px; }
  .lesson-actions{ display:flex; gap:3px; flex-shrink:0; }
  .lesson-series-tag{ display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:10px; color:var(--brand-text); }
  .course-tag{
    font-family:var(--font-mono); font-weight:700; font-size:10px; color:var(--sand-text); background:var(--sand);
    border-radius:6px; padding:3px 8px; text-transform:uppercase; letter-spacing:0.02em;
  }
  .format-tag{
    font-family:var(--font-mono); font-weight:700; font-size:10px; color:var(--brand-text); background:var(--brand-soft);
    border-radius:6px; padding:3px 8px;
  }
  .format-tag.individual{ color:var(--alert-text); background:var(--alert-soft); }
  .teacher-tag{
    display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-weight:600; font-size:10px;
    color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:3px 8px;
  }
  .teacher-tag{
    display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-weight:700; font-size:10px;
    color:var(--navy); background:var(--sand); border-radius:6px; padding:3px 8px 3px 6px;
  }
  :root.theme-dark .teacher-tag{ color:var(--ink); }
  .student-panel{ margin-top:14px; background:var(--paper); border-radius:10px; padding:6px 12px; }
  .student-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .student-row:first-child{ border-top:none; }
  .student-name{ font-size:14px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info-banner{
    display:flex; align-items:center; gap:8px; background:var(--brand-soft); color:var(--brand-text); font-size:12.5px; font-weight:500;
    border-radius:10px; padding:10px 14px; margin-bottom:18px;
  }
  .thumb-spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--brand-soft); border-top-color:var(--brand);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .thumb-slot{
    width:40px; height:40px; border-radius:9px; border:2px dashed var(--line-strong); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; overflow:hidden; position:relative;
    transition:border-color .15s ease, transform .15s ease;
  }
  .thumb-slot img{ width:100%; height:100%; object-fit:cover; }
  .thumb-slot:hover{ border-color:var(--brand); transform:scale(1.05); }
  .thumb-slot.has-photo{ border-style:solid; }
  .thumb-slot.readonly{ cursor:default; }
  .thumb-slot.readonly:hover{ border-color:var(--line-strong); transform:none; }
  .thumb-replace{
    position:absolute; right:-3px; bottom:-3px; width:18px; height:18px; border-radius:50%;
    background:var(--brand); color:#fff; border:2px solid var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:transform .12s ease, background .15s ease;
  }
  .thumb-replace:hover{ background:var(--brand-dark); transform:scale(1.12); }
  .due-flag{
    display:inline-flex; align-items:center; gap:6px; background:var(--alert-soft); color:var(--alert-text);
    border-radius:20px; padding:6px 12px 6px 6px; font-size:12px; font-weight:700; cursor:pointer; border:none; flex-shrink:0;
    animation:softPulse 2.4s ease-in-out infinite;
  }
  .due-flag img{ width:22px; height:22px; border-radius:6px; object-fit:cover; }
  .printed-pill{ font-family:var(--font-mono); font-weight:700; font-size:11px; color:var(--success-text); background:var(--success-soft); border-radius:20px; padding:6px 12px; flex-shrink:0; display:inline-flex; align-items:center; gap:5px; border:1.5px solid transparent; cursor:pointer; transition:transform .12s ease, box-shadow .15s ease; }
  .printed-pill:hover{ box-shadow:0 2px 8px rgba(79,168,112,0.25); }
  .printed-pill:active{ transform:scale(0.95); }
  .printed-pill.off{ color:var(--alert-text); background:var(--alert-soft); border:1.5px solid transparent; }
  .printed-pill.off:hover{ box-shadow:0 2px 8px rgba(224,142,69,0.25); }
  .trial-pill{
    font-family:var(--font-mono); font-weight:700; font-size:10.5px; color:#fff; background:#8B5CF6;
    border-radius:20px; padding:5px 11px; flex-shrink:0; border:1.5px solid transparent; cursor:pointer;
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .trial-pill:hover{ box-shadow:0 2px 8px rgba(139,92,246,0.35); }
  .trial-pill:active{ transform:scale(0.95); }
  .trial-pill.off{ color:#8B5CF6; background:rgba(139,92,246,0.12); }
  .printed-by{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-soft); flex-basis:100%; padding-left:2px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 15px; border-radius:20px; border:1.5px solid var(--line-strong);
    background:var(--card); font-size:13.5px; font-weight:500; cursor:pointer; user-select:none; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .chip.selected{ background:var(--brand); color:#fff; border-color:var(--brand); transform:scale(1.03); font-weight:700; }
  .chip-avatar{
    width:20px; height:20px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--brand), var(--sand-text)); color:#fff; font-family:var(--font-display); font-weight:700; font-size:9px;
    flex-shrink:0;
  }
  .chip-avatar img{ width:100%; height:100%; object-fit:cover; }
  .empty-state{ border:2px dashed var(--line-strong); border-radius:16px; padding:40px 20px 44px; text-align:center; color:var(--ink-soft); animation:fadeIn .3s ease both; }
  .empty-mascot{ display:flex; justify-content:center; margin-bottom:14px; font-size:48px; animation:floaty 3s ease-in-out infinite; }
  .empty-state-title{ font-family:var(--font-display); font-size:16.5px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .empty-state-sub{ font-size:13px; max-width:320px; margin:0 auto; }
  .students-list{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .students-row{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--line); animation:fadeInUp .25s ease both; transition:background .15s ease; }
  .students-row:hover{ background:var(--paper); }
  .students-row:last-child{ border-bottom:none; }
  .admin-row{ cursor:pointer; }
  .role-badge{ font-family:var(--font-mono); font-size:9.5px; font-weight:700; text-transform:uppercase; background:var(--navy); color:#fff; border-radius:20px; padding:3px 8px; letter-spacing:0.03em; }
  .role-badge.me{ background:var(--brand); }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, var(--brand), var(--sand-text));
    color:#fff; box-shadow:0 0 0 2px var(--card), 0 0 0 3.5px var(--brand-soft);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14.5px; flex-shrink:0; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar.lg{ width:64px; height:64px; font-size:23px; box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--brand-soft); }
  .avatar.sm{ width:28px; height:28px; font-size:11px; box-shadow:0 0 0 1.5px var(--card), 0 0 0 2.5px var(--brand-soft); flex-shrink:0; }
  .students-meta{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }
  .students-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .print-item{ display:flex; gap:14px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px; animation:fadeInUp .3s ease both; transition:box-shadow .15s ease, border-color .15s ease; flex-wrap:wrap; }
  .print-item:hover{ box-shadow:0 4px 16px rgba(5,38,63,0.08); border-color:var(--line-strong); }
  .print-thumb{
    width:58px; height:58px; border-radius:10px; flex-shrink:0; cursor:pointer; border:2px dashed var(--line-strong);
