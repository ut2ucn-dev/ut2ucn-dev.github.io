name: Mobile app

# Builds the Flutter app in mobile/ for Android and iPhone, and the admin
# console for macOS from the same code, and publishes the files as a GitHub
# Release:
#   - main:           release "mobile-v2.0.<run>", marked latest — the in-app
#                     update check and the download links point at it;
#   - other branches: prerelease "mobile-preview-<branch>", replaced on
#                     every push, for trying a change before it is merged.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.STEMIK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional private release key from repository secrets; without them
      # the shared key in mobile/android/keystore/ signs the build.
      - name: Release key from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STEMIK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          STEMIK_KEYSTORE_PASSWORD: ${{ secrets.STEMIK_KEYSTORE_PASSWORD }}
          STEMIK_KEY_ALIAS: ${{ secrets.STEMIK_KEY_ALIAS }}
          STEMIK_KEY_PASSWORD: ${{ secrets.STEMIK_KEY_PASSWORD }}
        # Build numbers start at 1000 so this app installs over the first
        # (WebView) APK, which used 1, 2, … Only phone CPUs (ARM): x86_64 is
        # for emulators and would add a third of the size.
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --build-name=2.0.$GITHUB_RUN_NUMBER
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/stemik.apk

      # Resources looked up only by name must survive resource shrinking,
      # or the app fails at startup (see android/app/src/main/res/raw/keep.xml).
      - name: Check APK resources
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump resources build/app/outputs/flutter-apk/app-release.apk > resources.txt
          grep -q 'drawable/ic_notification' resources.txt || { echo "ic_notification missing from the APK"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: stemik-android
          path: dist/stemik.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Unsigned: installing on an iPhone needs signing with an Apple ID
      # (see mobile/README.md).
      - name: Build iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --build-name=2.0.$GITHUB_RUN_NUMBER
          mkdir -p Payload ../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../dist/stemik-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: stemik-ios
          path: dist/stemik-unsigned.ipa

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Signed ad hoc, not notarized: the first launch needs "Open Anyway"
      # in System Settings (see mobile/README.md). The same build numbers as
      # the phone builds, so the in-app update check compares like for like.
      - name: Build macOS app
        run: |
          flutter build macos --release \
            --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --build-name=2.0.$GITHUB_RUN_NUMBER
          mkdir -p dmg ../dist
          cp -R "build/macos/Build/Products/Release/Stemik Admin.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Stemik Admin" -srcfolder dmg -ov -format UDZO ../dist/stemik-admin.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: stemik-macos
          path: dist/stemik-admin.dmg

  publish:
    needs: [android, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="2.0.$GITHUB_RUN_NUMBER"
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          if [ "$BRANCH" = "main" ]; then
            TAG="mobile-v$VERSION"
            FLAGS="--latest"
            TITLE="Stemik $VERSION"
          else
            SLUG=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-*$//')
            TAG="mobile-preview-$SLUG"
            FLAGS="--prerelease --latest=false"
            TITLE="Stemik $VERSION (тест: $BRANCH)"
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
          fi
          BASE="https://github.com/$REPO/releases/latest/download"
          cat > dist/version.json <<EOF
          {"versionCode": $CODE, "versionName": "$VERSION", "apkUrl": "$BASE/stemik.apk", "dmgUrl": "$BASE/stemik-admin.dmg"}
          EOF
          gh release create "$TAG" dist/stemik.apk dist/stemik-unsigned.ipa dist/stemik-admin.dmg dist/version.json \
            --repo "$REPO" --target "$GITHUB_SHA" --title "$TITLE" $FLAGS \
            --notes "Android: встановіть stemik.apk. iPhone: stemik-unsigned.ipa. Mac (для адміністраторів): stemik-admin.dmg — див. mobile/README.md."
