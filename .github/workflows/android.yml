name: Android APK

# Builds the Stemik Android app (android/) and commits the signed APK to
# downloads/stemik.apk on the same branch, so after a merge to main it can
# be downloaded straight from https://ut2ucn-dev.github.io/downloads/stemik.apk
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.STEMIK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Optional: a private release key from repository secrets. Without them
      # the shared key in android/keystore/ signs the build.
      - name: Release key from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STEMIK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          STEMIK_KEYSTORE_PASSWORD: ${{ secrets.STEMIK_KEYSTORE_PASSWORD }}
          STEMIK_KEY_ALIAS: ${{ secrets.STEMIK_KEY_ALIAS }}
          STEMIK_KEY_PASSWORD: ${{ secrets.STEMIK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../downloads
          cp app/build/outputs/apk/release/app-release.apk ../downloads/stemik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stemik-apk
          path: downloads/stemik.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add downloads/stemik.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Android APK (run ${{ github.run_number }})"
          git push
