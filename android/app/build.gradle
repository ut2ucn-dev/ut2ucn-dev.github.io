plugins {
    id "com.android.application"
}

// The release key comes from CI secrets when they are set (see README.md);
// otherwise the shared key committed next to this file is used, so every
// build is signed the same way and installs over the previous one.
def env = System.getenv()
def releaseKeystore = env.STEMIK_KEYSTORE ? file(env.STEMIK_KEYSTORE) : file("../keystore/stemik-shared.jks")
def runNumber = (env.GITHUB_RUN_NUMBER ?: "1").toInteger()

android {
    namespace "studio.stemik.app"
    compileSdk 35

    defaultConfig {
        applicationId "studio.stemik.app"
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword env.STEMIK_KEYSTORE_PASSWORD ?: "stemik-shared"
            keyAlias env.STEMIK_KEY_ALIAS ?: "stemik"
            keyPassword env.STEMIK_KEY_PASSWORD ?: "stemik-shared"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
