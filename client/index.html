<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5B4FE0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Stemik" />
<title>Stemik · кабінет батьків</title>
<link rel="icon" type="image/png" href="../assets/brand/robot-light.png">
<link rel="preload" as="image" href="../assets/brand/intro-base.png">
<link rel="preload" as="image" href="../assets/brand/intro-brain.png">
<link rel="preload" as="image" href="../assets/brand/wave-dark-hand.png">
<link rel="preload" as="image" href="../assets/brand/wordmark-dark.png">
<link rel="apple-touch-icon" href="../assets/brand/robot-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the studio CRM (../index.html), so both feel like one
     product; the portal adds bigger, more colourful surfaces on top. */
  :root{
    --ink:#171923; --ink-soft:#6B7080; --paper:#F6F6FB; --card:#FFFFFF;
    --line:#E7E8F1; --line-strong:#D7D9E8;
    --brand:#5B4FE0; --brand-dark:#4438C2; --brand-soft:#EFEDFC; --brand-text:#4B3FCB;
    --violet:#8B5CF6; --violet-soft:rgba(139,92,246,0.13);
    --alert:#F5A524; --alert-soft:#FDF1DC; --alert-text:#95610A;
    --danger:#E5484D; --danger-soft:#FDECEC; --danger-text:#B4232A;
    --success:#16A34A; --success-soft:#E7F8ED; --success-text:#0F7A38;
    --navy:#1C1642;
    --shadow:0 10px 30px rgba(28,22,66,0.08);
    color-scheme:light;
    --font:'Exo 2','Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  :root.theme-dark{
    --ink:#F1F2F8; --ink-soft:#9497AC; --paper:#0F0F16; --card:#181924;
    --line:#262837; --line-strong:#34364A;
    --brand:#8B80FF; --brand-dark:#A79CFF; --brand-soft:rgba(139,128,255,0.18); --brand-text:#B4AAFF;
    --violet:#A78BFA; --violet-soft:rgba(167,139,250,0.16);
    --alert:#FFB84D; --alert-soft:rgba(255,184,77,0.16); --alert-text:#FFC777;
    --danger:#FF6B70; --danger-soft:rgba(255,107,112,0.15); --danger-text:#FF9A9E;
    --success:#4ADE80; --success-soft:rgba(74,222,128,0.16); --success-text:#6EE7A0;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    color-scheme:dark;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @keyframes shake{ 10%,90%{ transform:translateX(-1px); } 20%,80%{ transform:translateX(2px); } 30%,50%,70%{ transform:translateX(-4px); } 40%,60%{ transform:translateX(4px); } }
  @keyframes drift{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(30px,20px) scale(1.08); } }

  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--font); }
  *{ box-sizing:border-box; }
  button{ font-family:inherit; }
  a{ color:var(--brand-text); }
  .app{ min-height:100vh; position:relative; overflow-x:hidden; }
  .bg-dots{ position:absolute; inset:0; pointer-events:none; opacity:.55;
    background-image:radial-gradient(circle, var(--line-strong) 1px, transparent 1px); background-size:26px 26px;
    mask-image:linear-gradient(to bottom, black, transparent 420px); -webkit-mask-image:linear-gradient(to bottom, black, transparent 420px); }

  /* --- login ------------------------------------------------------- */
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; position:relative; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; animation:drift 14s ease-in-out infinite; pointer-events:none; }
  .blob.b1{ width:380px; height:380px; background:var(--brand); top:-120px; left:-120px; }
  .blob.b2{ width:320px; height:320px; background:var(--violet); bottom:-120px; right:-90px; animation-delay:-5s; }
  .blob.b3{ width:220px; height:220px; background:#22D3EE; top:40%; right:12%; opacity:.18; animation-delay:-9s; }
  .login-card{ position:relative; width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:26px; padding:30px 26px 24px; box-shadow:var(--shadow); text-align:center; animation:fadeInUp .35s ease both; }
  .login-card.shake{ animation:shake .42s ease; }
  .mascot{ display:flex; justify-content:center; animation:floaty 3s ease-in-out infinite; filter:drop-shadow(0 8px 16px rgba(91,79,224,.35)); }
  .login-robot{ position:relative; width:176px; margin:-86px auto 0; }
  .login-robot .bubble{ right:-70px; top:6px; }
  .login-card{ margin-top:80px; }
  .login-logo{ height:30px; width:auto; }
  .login-title{ font-size:25px; font-weight:800; margin-top:6px; letter-spacing:-0.01em; }
  .login-sub{ font-size:13.5px; color:var(--ink-soft); margin:6px 0 20px; line-height:1.45; }
  .field{ text-align:left; margin-bottom:13px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:13px; border:1.5px solid var(--line-strong);
    background:var(--paper); color:var(--ink); outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  .field input:focus{ border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .pw-wrap{ position:relative; }
  .pw-toggle{ position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:6px; font-size:12px; font-weight:700; }
  .error{ background:var(--danger-soft); color:var(--danger-text); border-radius:12px; padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:12px; text-align:left; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:12px 18px;
    font-size:15px; font-weight:700; cursor:pointer; transition:transform .12s ease, box-shadow .15s ease, background .15s ease; }
  .btn:active{ transform:scale(.98); }
  .btn.primary{ background:linear-gradient(135deg, var(--brand), var(--violet)); color:#fff; box-shadow:0 8px 20px rgba(91,79,224,.32); }
  .btn.primary:disabled{ opacity:.6; cursor:default; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1.5px solid var(--line); }
  .btn.block{ width:100%; }
  .login-foot{ font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.5; }
  .login-links{ margin-top:18px; font-size:12px; color:var(--ink-soft); display:flex; gap:8px; justify-content:center; position:relative; }
  .login-links a{ text-decoration:none; }

  /* --- shell ------------------------------------------------------- */
  .wrap{ position:relative; max-width:1080px; margin:0 auto; padding:16px 16px 60px; }
  .topbar{ display:flex; align-items:center; gap:12px; padding:6px 0 18px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-weight:800; font-size:19px; letter-spacing:-0.02em; }
  .brand-sub{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:1px; }
  .topbar-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .icon-btn{ width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  .icon-btn:hover{ border-color:var(--brand); color:var(--brand-text); }
  .parent-chip{ display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:5px 12px 5px 5px; }
  .parent-chip .av{ width:30px; height:30px; border-radius:10px; background:var(--brand-soft); color:var(--brand-text); display:flex; align-items:center; justify-content:center; }
  .parent-chip .nm{ font-size:13px; font-weight:700; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .kids{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none; }
  .kids::-webkit-scrollbar{ display:none; }
  .kid{ display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:18px; border:1.5px solid var(--line); background:var(--card);
    cursor:pointer; flex-shrink:0; transition:all .15s ease; }
  .kid .ph{ width:38px; height:38px; border-radius:13px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--brand), var(--violet)); color:#fff; font-weight:800; font-size:16px; }
  .kid .ph img{ width:100%; height:100%; object-fit:cover; }
  .kid .kn{ font-weight:700; font-size:14px; }
  .kid.active{ border-color:var(--brand); background:var(--brand); color:#fff; box-shadow:0 8px 20px rgba(91,79,224,.3); }
  .kid.active .ph{ background:rgba(255,255,255,.22); }

  /* brand logo: one image per theme */
  .brand-robot{ width:40px; height:auto; display:block; }
  img.logo-d{ display:none; }
  :root.theme-dark img.logo-l{ display:none; }
  :root.theme-dark img.logo-d{ display:block; }

  /* waving robot: the logo split into body + arm, the arm swings from the shoulder */
  @keyframes wave{ 0%,58%,100%{ transform:rotate(0deg); } 8%{ transform:rotate(-9deg); } 16%{ transform:rotate(8deg); }
    24%{ transform:rotate(-9deg); } 32%{ transform:rotate(7deg); } 40%{ transform:rotate(-5deg); } 48%{ transform:rotate(2deg); } }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.9); } to{ opacity:1; transform:none; } }
  .waver{ position:relative; animation:bob 4.8s ease-in-out infinite; }
  .waver img{ display:block; width:100%; height:auto; }
  .waver .arm{ position:absolute; inset:0; transform-origin:34% 75%; animation:wave 3.2s ease-in-out infinite; }
  .waver .variant{ position:relative; }
  .waver .variant.v-dark{ display:none; }
  :root.theme-dark .waver.themed .variant.v-light{ display:none; }
  :root.theme-dark .waver.themed .variant.v-dark{ display:block; }
  .waver.on-dark .variant.v-light{ display:none; }
  .waver.on-dark .variant.v-dark{ display:block; }
  .waver-shadow{ width:62%; height:14px; margin:-4px auto 0; border-radius:50%; background:radial-gradient(closest-side, rgba(5,38,63,.22), transparent); }
  .bubble{ position:absolute; z-index:2; background:#fff; color:#05263F; font-weight:800; font-size:13px; line-height:1.3; padding:9px 13px; border-radius:16px 16px 16px 4px;
    box-shadow:0 8px 22px rgba(5,38,63,.18); animation:pop .4s .3s ease both; max-width:190px; }

  /* hero */
  .hero{ position:relative; overflow:hidden; border-radius:30px; padding:26px 26px 22px; color:#fff;
    background:radial-gradient(120% 140% at 100% 0%, #2B5C86 0%, rgba(43,92,134,0) 55%), radial-gradient(90% 120% at 0% 100%, rgba(91,79,224,.55) 0%, rgba(91,79,224,0) 60%), linear-gradient(135deg, #05263F 0%, #0B3558 100%);
    box-shadow:0 22px 48px rgba(5,38,63,.28); animation:fadeInUp .35s ease both; }
  .hero::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
    background-image:radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1.2px); background-size:22px 22px;
    mask-image:linear-gradient(110deg, transparent 30%, black 100%); -webkit-mask-image:linear-gradient(110deg, transparent 30%, black 100%); }
  .hero-grid{ position:relative; display:grid; grid-template-columns:1fr 160px; gap:18px; align-items:center; }
  .hero-top{ position:relative; display:flex; align-items:center; gap:16px; }
  .hero-ph{ width:72px; height:72px; border-radius:22px; overflow:hidden; background:linear-gradient(135deg, #5CA7C9, #5B4FE0); display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; flex-shrink:0; border:2px solid rgba(255,255,255,.3); box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .hero-ph img{ width:100%; height:100%; object-fit:cover; }
  .hero-name{ font-size:30px; font-weight:800; letter-spacing:-0.02em; line-height:1.12; margin-top:6px; }
  .xp{ height:9px; border-radius:9px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:10px; }
  .xp > span{ display:block; height:100%; border-radius:9px; background:linear-gradient(90deg, #5CA7C9, #8B80FF, #FFD36E);
    box-shadow:0 0 12px rgba(139,128,255,.6); transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .hero-robot{ position:relative; padding-top:30px; margin:-8px 0 -12px; }
  .hero-robot .bubble{ right:62%; top:0; white-space:nowrap; max-width:none; }

  /* achievements */
  .ach-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .ach{ position:relative; border-radius:18px; padding:14px 12px 12px; text-align:center; border:1px solid var(--line); background:var(--paper); transition:transform .15s ease; }
  .ach:hover{ transform:translateY(-2px); }
  .ach .medal{ width:52px; height:52px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:25px;
    background:radial-gradient(circle at 30% 30%, #fff, #FFE7A8 45%, #F5A524 100%); box-shadow:0 0 0 4px rgba(245,165,36,.18), 0 8px 18px rgba(245,165,36,.3); }
  .ach .nm{ font-weight:800; font-size:13px; }
  .ach .ds{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }
  .ach.locked .medal{ background:var(--line); box-shadow:none; filter:grayscale(1); opacity:.6; }
  .ach.locked .nm{ color:var(--ink-soft); }
  .ach .prog{ height:5px; border-radius:5px; background:var(--line); margin-top:8px; overflow:hidden; }
  .ach .prog > span{ display:block; height:100%; background:var(--brand); border-radius:5px; }
  .ach .tick{ position:absolute; top:8px; right:8px; width:18px; height:18px; border-radius:50%; background:var(--success); color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; }

  /* tabs */
  .tabs{ display:flex; gap:6px; margin:20px 0 16px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:4px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:1; min-width:max-content; border:none; background:none; border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px; transition:background .15s ease, color .15s ease; }
  .tab.active{ background:var(--brand); color:#fff; box-shadow:0 4px 12px rgba(91,79,224,.3); }
  .tab .cnt{ font-size:11px; background:var(--brand-soft); color:var(--brand-text); border-radius:20px; padding:1px 7px; }
  .tab .tic{ display:none; }

  /* compact hero additions */
  .hero-greet{ font-size:12.5px; font-weight:700; color:#BFE3F3; }
  .lvl-line{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12.5px; font-weight:700; color:rgba(255,255,255,.85); }
  .lvl-chip{ width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; color:#05263F;
    background:linear-gradient(135deg, #FFD36E, #F5A524); box-shadow:0 0 0 2px rgba(245,165,36,.25); flex-shrink:0; }
  .lvl-line .xpv{ color:#FFD36E; margin-left:auto; white-space:nowrap; }
  .hero .xp{ margin-top:8px; height:7px; }
  .hero-nums{ position:relative; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:16px; }
  .hero-num{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px 12px; }
  .hero-num .v{ font-size:22px; font-weight:800; line-height:1; }
  .hero-num .l{ font-size:11px; color:rgba(255,255,255,.7); margin-top:4px; font-weight:600; line-height:1.25; }

  /* overview */
  .next-card{ display:flex; align-items:center; gap:12px; }
  .next-card .ic{ width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0; }
  .next-card .t1{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:800; color:var(--ink-soft); }
  .next-card .t1 b{ color:var(--brand-text); }
  .next-card .t2{ font-size:16px; font-weight:800; margin-top:1px; }
  .next-card .t3{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .link-btn{ border:none; background:none; color:var(--brand-text); font-weight:700; font-size:12.5px; cursor:pointer; padding:0; font-family:inherit; }
  .ok-strip{ display:flex; align-items:center; gap:10px; border-radius:16px; padding:12px 14px; background:var(--success-soft); color:var(--success-text); font-weight:700; font-size:13.5px; animation:fadeInUp .3s ease both; }
  .ok-strip .ico{ width:26px; height:26px; border-radius:50%; background:var(--success); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .sub-line{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .sub-line:last-child{ border-bottom:none; padding-bottom:0; }
  .sub-line .nm{ font-weight:700; font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub-line .left{ font-weight:800; font-size:13px; color:var(--brand-text); white-space:nowrap; }
  .sub-line .mini{ width:56px; height:6px; border-radius:6px; background:var(--line); overflow:hidden; flex-shrink:0; }
  .sub-line .mini > span{ display:block; height:100%; background:var(--brand); border-radius:6px; }
  .stack > * + *{ margin-top:12px; }
  .ach-strip{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px; margin:0 -2px; scroll-snap-type:x proximity; }
  .ach-strip::-webkit-scrollbar{ display:none; }
  .ach-strip .ach{ flex:0 0 112px; padding:12px 8px 10px; scroll-snap-align:start; }
  .ach-strip .ach .medal{ width:44px; height:44px; font-size:21px; }
  .ach-strip .ach .ds{ display:none; }
  .ach-strip .ach .prog{ margin-top:6px; }
  .lesson{ cursor:pointer; }
  .lesson .more{ font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
  .lesson .meta-full{ display:inline; }
  .tab.active .cnt{ background:rgba(255,255,255,.22); color:#fff; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:0 1px 0 var(--line); animation:fadeInUp .3s ease both; }
  .card + .card{ margin-top:14px; }
  .grid2 .card + .card{ margin-top:0; }
  .card-title{ display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; margin-bottom:12px; }
  .card-title .em{ font-size:19px; }
  .card-title .aside{ margin-left:auto; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .muted{ color:var(--ink-soft); font-size:13px; }
  .empty{ text-align:center; padding:26px 12px; color:var(--ink-soft); font-size:13.5px; }
  .empty .big{ font-size:38px; margin-bottom:6px; }

  /* courses */
  .course{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:var(--paper); }
  .course + .course{ margin-top:8px; }
  .course .ic{ width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0; }
  .course .nm{ font-weight:800; font-size:14.5px; }
  .course .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .bar{ height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:7px; }
  .bar > span{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--brand), var(--violet)); }

  /* money */
  .balance{ border-radius:22px; padding:18px; position:relative; overflow:hidden; }
  .balance.ok{ background:linear-gradient(135deg, var(--success-soft), var(--card)); border:1px solid var(--line); }
  .balance.due{ background:linear-gradient(135deg, var(--alert-soft), var(--card)); border:1px solid var(--line); }
  .balance .lbl{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .balance .sum{ font-size:32px; font-weight:800; margin:4px 0 2px; letter-spacing:-0.02em; }
  .balance.ok .sum{ color:var(--success-text); }
  .balance.due .sum{ color:var(--alert-text); }
  .pay-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .soon{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; background:var(--violet-soft); color:var(--violet); border-radius:20px; padding:4px 9px; }
  .btn.pay{ background:linear-gradient(135deg, var(--brand), var(--violet)); color:#fff; opacity:.45; cursor:not-allowed; }

  .sub{ display:flex; align-items:center; gap:14px; padding:12px; border-radius:16px; background:var(--paper); }
  .sub + .sub{ margin-top:8px; }

<div id="intro" class="intro" aria-hidden="true">

<script>
// Launch intro: once per browser session, never under "reduce motion".
// Plays once the artwork is in (or after 600 ms at the latest); a click
// skips it. The portal loads underneath the whole time.
(function(){
  var el = document.getElementById("intro");
  var show = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try {
    if (sessionStorage.getItem("stemik-intro-shown")) show = false;
    sessionStorage.setItem("stemik-intro-shown", "1");
  } catch (e) {}
  if (!show) { el.parentNode.removeChild(el); return; }
  var started = false;
  function start(){ if (!started) { started = true; el.classList.add("play"); } }
  function done(){ if (el.parentNode) el.parentNode.removeChild(el); }
  var imgs = el.querySelectorAll("img"), left = imgs.length;
  function loaded(){ if (--left === 0) start(); }
  for (var i = 0; i < imgs.length; i++) {
    if (imgs[i].complete) loaded();
    else { imgs[i].addEventListener("load", loaded); imgs[i].addEventListener("error", loaded); }
  }
  setTimeout(start, 600);
  el.addEventListener("animationend", function(e){ if (e.target === el) done(); });
  el.addEventListener("click", function(){ el.classList.add("skip"); setTimeout(done, 320); });
})();
</script>

<script>
// Parents' portal. Parents are not Supabase Auth users: they sign in with
// phone + password through parent_login() and read everything through
// parent_portal(token) (sql/0018). Both are plain PostgREST RPC calls with
// the public anon key, so this page needs no supabase-js.
const { useState, useEffect, useMemo, useCallback } = React;
const h = React.createElement;

const TOKEN_KEY = "stemik-parent-token";
const CACHE_KEY = "stemik-parent-portal";

// Online payment: the button is in place but off until a payment provider
// is chosen. startOnlinePayment() is where the provider's checkout goes.
const ONLINE_PAYMENTS = { enabled: false, provider: null };
function startOnlinePayment(student, lessons) {
  return Promise.reject(new Error("Онлайн-оплата ще в розробці"));
}

function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, value) { try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch (e) {} }

class ApiError extends Error {
  constructor(message, code) { super(message); this.code = code; }
}
async function rpc(name, params) {
  let res;
  try {
    res = await fetch(`${window.SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": window.SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${window.SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(params)
    });
  } catch (e) {
    throw new ApiError("Немає з'єднання з сервером", "offline");
  }
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = body && body.message || `Помилка сервера (код ${res.status})`;
    throw new ApiError(msg === "session_expired" ? "Сесія завершилась — увійдіть знову" : msg, msg === "session_expired" ? "session" : "server");
  }
  return body;
}

// ---------------------------------------------------------------
// Vocabulary (same values as ../index.html and mobile/lib/util/domain.dart)
// ---------------------------------------------------------------
const FORMAT_LABELS = {
  group: "Група (очно)",
  individual: "Індив (очно)",
  individual_online: "Індив (online)",
  group_online: "Група (online)"
};
const PAYMENT_LABELS = {
  card: "Оплачено карткою",
  cash: "Оплачено готівкою",
  subscription: "За абонементом",
  certificate: "Сертифікат"
};
const MONTHS_SHORT = ["січ", "лют", "бер", "кві", "тра", "чер", "лип", "сер", "вер", "жов", "лис", "гру"];
const MONTHS_GEN = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
const WEEKDAYS = ["неділя", "понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота"];

function isOnline(format) { return format === "individual_online" || format === "group_online"; }
function courseHasPrinting(course) { return !course || course.startsWith("3D"); }
function lessonPrints(l) { return courseHasPrinting(l.course) && (!isOnline(l.format) || l.print_enabled); }
function courseLook(course) {
  const c = course || "";
  if (c.startsWith("3D")) return { emoji: "🧊", bg: "rgba(91,79,224,.14)" };
  if (c.startsWith("VR")) return { emoji: "🥽", bg: "rgba(34,211,238,.16)" };
  if (c.startsWith("Robo")) return { emoji: "🤖", bg: "rgba(245,165,36,.18)" };
  return { emoji: "✨", bg: "rgba(139,92,246,.14)" };
}
function parseDate(d) { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day); }
function fmtDate(d) { const x = parseDate(d); return `${x.getDate()} ${MONTHS_GEN[x.getMonth()]}`; }
function fmtDateFull(d) { const x = parseDate(d); return `${x.getDate()} ${MONTHS_GEN[x.getMonth()]} ${x.getFullYear()}`; }
function fmtTime(t) { return t ? t.slice(0, 5) : ""; }
function money(n) { return Math.round(Number(n) || 0).toLocaleString("uk-UA").replace(/,/g, " ") + " грн"; }
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function initial(name) { return (name || "?").trim().charAt(0).toUpperCase() || "?"; }
function formatPhone(phone) {
  const m = String(phone || "").match(/^380(\d{2})(\d{3})(\d{2})(\d{2})$/);
  return m ? `+380 ${m[1]} ${m[2]} ${m[3]} ${m[4]}` : phone || "";
}

// One lesson's state from the parent's point of view.
function lessonState(l, today) {
  if (!l.status) return l.date >= today ? { key: "upcoming", label: "Заплановано", tone: "brand" } : { key: "unmarked", label: "Очікує відмітки", tone: "grey" };
  if (l.status === "absent") return { key: "absent", label: "Пропуск", tone: "grey" };
  if (l.status === "excused") return { key: "excused", label: "Пропуск (поважна)", tone: "grey" };
  if (l.payment_method) return { key: "paid", label: PAYMENT_LABELS[l.payment_method] || "Оплачено", tone: l.payment_method === "certificate" ? "amber" : "green" };
  return { key: "unpaid", label: "Не сплачено", tone: "red" };
}

    case "card": return h("svg", p, h("rect", { x: 2, y: 5, width: 20, height: 14, rx: 2 }), h("path", { d: "M2 10h20" }));
    case "home": return h("svg", p, h("path", { d: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" }));
    case "cube": return h("svg", p, h("path", { d: "M12 2 21 7v10l-9 5-9-5V7z" }), h("path", { d: "M3 7l9 5 9-5M12 12v10" }));

    default: return null;

function summarize(student, today) {
  const lessons = student.lessons || [];
  const past = lessons.filter(l => l.date < today || l.status);
  const attended = lessons.filter(l => l.status === "present");
  const upcoming = lessons.filter(l => l.date >= today && !l.status).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const unpaid = attended.filter(l => !l.payment_method);
  const due = unpaid.reduce((s, l) => s + (Number(l.due) || 0), 0);
  const certificates = attended.filter(l => l.payment_method === "certificate");
  const trials = lessons.filter(l => l.trial);
  const activeSubs = (student.subscriptions || []).filter(s => s.status === "active" && s.remaining_lessons > 0);
  const byCourse = {};
  lessons.forEach(l => {
    const k = l.course || "Інше";
    const c = byCourse[k] = byCourse[k] || { course: k, total: 0, attended: 0, first: l.date, last: l.date, formats: new Set(), next: null };
    c.total++;
    if (l.status === "present") c.attended++;
    if (l.date < c.first) c.first = l.date;
    if (l.date > c.last) c.last = l.date;
    c.formats.add(l.format);
  });
  upcoming.forEach(l => {
    const c = byCourse[l.course || "Інше"];
    if (c && !c.next) c.next = l;
  });
  const courses = Object.values(byCourse).sort((a, b) => b.last.localeCompare(a.last));
  const models = (student.works || []).filter(w => w.photo || courseHasPrinting(w.course));
  return { today, lessons, past, attended, upcoming, unpaid, due, certificates, trials, activeSubs, courses, models };
}

// Levels by lessons attended — the game layer on top of the numbers.
const LEVELS = [
  { at: 0, name: "Новачок" },
  { at: 4, name: "Дослідник" },
  { at: 8, name: "Конструктор" },
  { at: 16, name: "Інженер" },
  { at: 32, name: "Винахідник" },
  { at: 64, name: "Майстер Stemik" }
];
function levelOf(attended) {
  let i = 0;
  while (i + 1 < LEVELS.length && attended >= LEVELS[i + 1].at) i++;
  const next = LEVELS[i + 1];
  const from = LEVELS[i].at;
  return {
    n: i + 1,
    name: LEVELS[i].name,
    next,
    toNext: next ? next.at - attended : 0,
    progress: next ? (attended - from) / (next.at - from) : 1
  };
}

function daysUntil(date, today) {
  const n = Math.round((parseDate(date) - parseDate(today)) / 86400000);
  if (n <= 0) return "сьогодні";

  return `через ${n} ${plural(n, "день", "дні", "днів")}`;
}

  return h("div", { className: "stack" }, h(CoursesCard, { sum }), h("div", { className: "card" },

    list.length === 0 ? h("div", { className: "empty" }, h("div", { className: "big" }, "🗓️"), "Тут поки порожньо")
      : list.map(l => h(LessonRow, { key: l.id, l, today }))));
}

// A work photo that fails to load (deleted, offline) falls back to the
// course's emoji instead of a broken-image icon.
function ModelPhoto({ w, fallback }) {
  const [broken, setBroken] = useState(false);
  if (!w.photo || broken) return fallback;
  return h("img", { src: w.photo, alt: "", loading: "lazy", onError: () => setBroken(true) });
}

function ModelsTab({ sum, onOpen }) {
  if (sum.models.length === 0) {
    return h("div", { className: "card" }, h("div", { className: "empty" }, h("div", { className: "big" }, "🧊"), "Моделі з'являться тут після занять, на яких діти створюють і друкують свої роботи."));
  }
  return h("div", { className: "gallery" }, sum.models.map((w, i) => {
    const look = courseLook(w.course);
    const prints = lessonPrints(w);
    return h("div", { key: w.lesson_id, className: "model", style: { animationDelay: Math.min(i, 12) * 30 + "ms" }, onClick: () => w.photo && onOpen(w) },
      h("div", { className: "img" },
        h(ModelPhoto, { w, fallback: look.emoji }),
        w.trial && h("span", { className: "pill violet" }, "Пробне")),
      h("div", { className: "body" },
        h("div", { className: "nm" }, w.theme || "Модель"),
        h("div", { className: "meta" }, `${fmtDateFull(w.date)} · ${w.course || ""}`),
        h("div", { className: "tags" },
          prints && (w.printed ? h("span", { className: "pill green" }, "🖨️ Надруковано") : h("span", { className: "pill amber" }, "⏳ Чекає на друк")),
          !w.photo && h("span", { className: "pill grey" }, "Фото згодом"))));
  }));
}

function PaymentsTab({ student, sum }) {
  return h("div", { className: "stack" },
    h(BalanceCard, { student, sum }),
    h(SubscriptionsCard, { subs: student.subscriptions || [] }),
    h(SpecialCard, { sum }),
    sum.unpaid.length > 0 && h("div", { className: "card" },
      h("div", { className: "card-title" }, h("span", { className: "em" }, "🧾"), "Не сплачені заняття"),
      sum.unpaid.map(l => h(LessonRow, { key: l.id, l, today: "" }))));
}

function OverviewTab({ student, sum, goTo }) {
  return h("div", { className: "stack" },
    h("div", { className: "grid2" },
      h(NextLessonCard, { sum, onAll: () => goTo("lessons") }),
      h(MoneyBlock, { student, sum })),
    h(SubscriptionLines, { sum, onAll: () => goTo("payments") }),
    h(AchievementsCard, { sum }));
}

function Portal({ data, offline, onRefresh, onLogout, theme, onToggleTheme }) {
  const students = data.students || [];
  const [studentId, setStudentId] = useState(() => lsGet("stemik-parent-child") || (students[0] && students[0].id));
  const [tab, setTab] = useState("overview");
  const [lightbox, setLightbox] = useState(null);
  const student = students.find(s => s.id === studentId) || students[0];
  useEffect(() => { if (student) lsSet("stemik-parent-child", student.id); }, [student && student.id]);
  useEffect(() => {
    if (!lightbox) return;
    const onKey = e => { if (e.key === "Escape") setLightbox(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lightbox]);
  const today = data.today;
  const sum = useMemo(() => student ? summarize(student, today) : null, [student, today]);
  const parentName = data.parent && (data.parent.name || formatPhone(data.parent.phone));

  return h("div", { className: "app" },
    h("div", { className: "bg-dots" }),
    h("div", { className: "wrap" },
      h("div", { className: "topbar" },
        h("div", { className: "brand" }, h(RobotIcon, { size: 40 }),
          h("div", null, h("div", { className: "brand-title" }, "Stemik"), h("div", { className: "brand-sub" }, "Кабінет батьків"))),
        h("div", { className: "topbar-right" },
          h("div", { className: "parent-chip", title: formatPhone(data.parent && data.parent.phone) },
            h("div", { className: "av" }, h(Icon, { name: "heart", size: 15 })), h("div", { className: "nm" }, parentName)),
          h("button", { className: "icon-btn", onClick: onRefresh, title: "Оновити" }, h(Icon, { name: "refresh" })),
          h("button", { className: "icon-btn", onClick: onToggleTheme, title: "Тема" }, h(Icon, { name: theme === "dark" ? "sun" : "moon" })),
          h("button", { className: "icon-btn", onClick: onLogout, title: "Вийти" }, h(Icon, { name: "logout" })))),
      offline && h("div", { className: "offline" }, "Немає зв'язку — показано останні збережені дані."),
      students.length > 1 && h("div", { className: "kids" }, students.map(s => h("div", {
        key: s.id, className: "kid" + (student && s.id === student.id ? " active" : ""), onClick: () => setStudentId(s.id)
      }, h("div", { className: "ph" }, s.photo ? h("img", { src: s.photo, alt: "" }) : initial(s.name)), h("div", { className: "kn" }, s.name)))),
      !student ? h("div", { className: "card" }, h("div", { className: "empty" }, h("div", { className: "big" }, "👋"),
        "До вашого кабінету ще не додано жодної дитини. Зверніться до адміністратора студії."))
        : h(React.Fragment, null,
          h(Hero, { student, sum, parentName: data.parent && data.parent.name }),
          h("div", { className: "tabs" },
            [["overview", "Огляд", "home", null], ["models", "Моделі", "cube", null], ["payments", "Оплати", "wallet", sum.unpaid.length || null], ["lessons", "Заняття", "calendar", null]]
              .map(([k, label, icon, cnt]) => h("button", { key: k, className: "tab" + (tab === k ? " active" : ""), onClick: () => { setTab(k); window.scrollTo({ top: 0, behavior: "smooth" }); } },
                h("span", { className: "tic" }, h(Icon, { name: icon, size: 21 })), label, cnt ? h("span", { className: "cnt" }, cnt) : null))),
          tab === "overview" && h(OverviewTab, { student, sum, goTo: setTab }),
          tab === "models" && h(ModelsTab, { sum, onOpen: setLightbox }),
          tab === "payments" && h(PaymentsTab, { student, sum }),
          tab === "lessons" && h(LessonsTab, { sum, today })),
      h("div", { className: "footer" }, "Питання щодо занять чи оплат — пишіть адміністратору студії · ",
        h("a", { href: "https://stemik.studio", target: "_blank", rel: "noopener" }, "stemik.studio"))),
    lightbox && h("div", { className: "lightbox", onClick: () => setLightbox(null) },
      h("div", null, h("img", { src: lightbox.photo, alt: "" }),
        h("div", { className: "cap" }, lightbox.theme || "Модель", h("span", null, `${fmtDateFull(lightbox.date)} · ${lightbox.course || ""}`)))));
}

// ---------------------------------------------------------------
// Root
// ---------------------------------------------------------------
function readCache() { try { return JSON.parse(lsGet(CACHE_KEY) || "null"); } catch (e) { return null; } }

function App() {
  const [theme, setTheme] = useState(() => document.documentElement.classList.contains("theme-dark") ? "dark" : "light");
  const [token, setToken] = useState(() => lsGet(TOKEN_KEY));
  const [data, setData] = useState(() => token ? readCache() : null);
  const [offline, setOffline] = useState(false);
  const [error, setError] = useState("");

  function toggleTheme() {
    const next = theme === "dark" ? "light" : "dark";
    document.documentElement.classList.toggle("theme-dark", next === "dark");
    lsSet("stemik-theme", next);
    setTheme(next);
  }
  const logout = useCallback(async (silent) => {
    const t = lsGet(TOKEN_KEY);
    lsSet(TOKEN_KEY, null);
    lsSet(CACHE_KEY, null);
    setToken(null);
    setData(null);
    if (t && !silent) rpc("parent_logout", { p_token: t }).catch(() => {});
  }, []);
  const load = useCallback(async () => {
    if (!token) return;
    setError("");
    try {
      const res = await rpc("parent_portal", { p_token: token });
      setData(res);
      setOffline(false);
      lsSet(CACHE_KEY, JSON.stringify(res));
    } catch (err) {
      if (err.code === "session") return logout(true);
      if (err.code === "offline") setOffline(true);
      else setError(err.message);
    }
  }, [token, logout]);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const onFocus = () => { if (document.visibilityState === "visible") load(); };
    document.addEventListener("visibilitychange", onFocus);
    return () => document.removeEventListener("visibilitychange", onFocus);
  }, [load]);

  if (!token) {
    return h(LoginScreen, {
      theme, onToggleTheme: toggleTheme,
      onSignedIn: t => { lsSet(TOKEN_KEY, t); setToken(t); }
    });
  }
  if (!data) {
    return h("div", { className: "loading" }, h(WavingRobot, { width: 130 }),
      error ? h("div", null, error, " ", h("a", { href: "#", onClick: e => { e.preventDefault(); load(); } }, "Спробувати ще"))
        : offline ? "Немає з'єднання з сервером…" : "Завантаження…");
  }
  return h(Portal, { data, offline, onRefresh: load, onLogout: () => logout(false), theme, onToggleTheme: toggleTheme });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
